<!doctype html>
<html lang="id">
	<head>
		<meta charset="utf-8" />
		<!-- resizes-content: saat keyboard HP muncul, viewport layout ikut menyusut sehingga
		     navigator bab yang sticky dan tombol aksi tetap berada di area yang terlihat. -->
		<meta
			name="viewport"
			content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content"
		/>
		<meta name="description" content="WebCo. — ruang briefing pembuatan website. Isi dossier 8 bab, kirim sekali, tim kami menghubungi Anda." />
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link
			href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap"
			rel="stylesheet"
		/>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
